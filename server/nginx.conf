# Paper Agent Platform — 反向代理
# 文档 §23：paper-nginx 把前端静态 + /api/* 转给 paper-api。
upstream paper_api { server paper-api:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;   # 允许上传较大的 data/ 文件

    # 静态前端（由 FastAPI StaticFiles 提供）
    location / {
        proxy_pass http://paper_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API
    location /api/ {
        proxy_pass http://paper_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;     # 长轮询/大文件下载
    }

    # 健康检查
    location = /healthz {
        proxy_pass http://paper_api/api/health;
    }
}
